    <section>
        <!-- create an Account modal code -->
         <div class="modal fade" id="newuser-modal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Create An Account</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
          <form action="index.html" method="post" enctype="multipart/form-data">

               <div class="mt-3 mb-2">
                 <label for="name">Name</label>
                 <input type="text" name="name" id="name" required class="form-control mt-1">
                </div>

                <div class="mt-3 mb-2">
                 <label for="email">Email</label>
                 <input type="email" name="email" id="email" required class="form-control mt-1">
                </div>
                <div class="mt-3 mb-2">
                 <label for="gen">Gender</label>
                 <div class="mt-2">
                    <input type="radio" name="gen" id="gen" required value="Male"> Male &nbsp;&nbsp;
                    <input type="radio" name="gen" id="gen" required value="Female"> Female
                  </div>
                </div>

                 <div class="mt-3 mb-2">
                    <label for="state">State</label>
                        <select name="state" id="state" required class="form-control mt-1">
                            <option selected disabled value="">Select Satte</option>
                            <option>Delhi</option>
                            <option>Haryana</option>
                            <option>Punjab</option>
                            <option>chandigarh</option>
                        </select>
                </div>

                 <div class="mt-3 mb-2">
                    <label for="photo">Photo</label>
                    <input type="file" name="photo" id="photo" required class="form-control mt-1">
                </div>

                <div class="mt-3 mb-2">
                    <label for="address">Address</label>
                    <textarea name="address" id="address" required class="form-control mt-1"></textarea>
                </div>

                 <div class="mt-3 mb-2">
                    <button class="btn btn-outline-secondary">Submit</button>
                </div>

          </form>
      </div>
      
    </div>
  </div>
</div>
    </section>

    <section>
        <!-- Login Modal Code -->
         <div class="modal fade" id="login-modal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Login</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
             <form action="login.html" method="post">
                    <div class="mb-3">
                        <label for="email" class="form-label">Email address</label>
                        <input type="email" class="form-control" name="email" id="email" aria-describedby="emailHelp">
                        <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" id="password">
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" name="check" id="check">
                        <label class="form-check-label" for="check">Check me out</label>
                    </div>
                    <button type="submit" class="btn btn-outline-secondary">Submit</button>
            </form>
      </div>
      
    </div>
  </div>
</div>
